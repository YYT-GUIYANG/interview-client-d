name: android-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core rule check
        run: |
          bash core/run-check.sh | tee core-check.log
          grep -q 'CoreCheck: all checks passed' core-check.log

      - name: Check D remote protocol fixture
        run: |
          python3 -m pip install 'websockets==16.0'
          python3 samples/remote-adapter/check_protocol.py | tee protocol-check.log

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/tmp/sdk-licenses.log || true

      - name: Fetch sherpa-onnx Android JNI libs
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/jniLibs downloads
          curl -L --retry 5 -o downloads/sherpa-onnx-v2.0.1-android.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          sha256sum downloads/sherpa-onnx-v2.0.1-android.tar.bz2 | tee downloads/android-libs.sha256
          mkdir -p downloads/android-extract
          tar -xjf downloads/sherpa-onnx-v2.0.1-android.tar.bz2 -C downloads/android-extract
          find downloads/android-extract -type f -name 'lib*.so' | tee downloads/so-found.txt
          while IFS= read -r so; do
            abi="$(basename "$(dirname "$so")")"
            case "$abi" in
              arm64-v8a|armeabi-v7a|x86_64|x86)
                mkdir -p "android-app/app/src/main/jniLibs/$abi"
                cp -a "$so" "android-app/app/src/main/jniLibs/$abi/"
                ;;
            esac
          done < downloads/so-found.txt
          find android-app/app/src/main/jniLibs -type f -name '*.so' | tee jni-libs-list.txt
          test -s jni-libs-list.txt

      - name: Fetch Chinese 14M streaming model
        run: |
          set -euo pipefail
          ASSETS=android-app/app/src/main/assets
          mkdir -p "$ASSETS" downloads
          curl -L --retry 5 -o downloads/model-14m.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2
          sha256sum downloads/model-14m.tar.bz2 | tee downloads/model-14m.sha256
          tar -xjf downloads/model-14m.tar.bz2 -C "$ASSETS"
          MODEL="$ASSETS/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"
          test -f "$MODEL/encoder-epoch-99-avg-1.int8.onnx"
          test -f "$MODEL/decoder-epoch-99-avg-1.onnx"
          test -f "$MODEL/joiner-epoch-99-avg-1.int8.onnx"
          test -f "$MODEL/tokens.txt"
          rm -rf "$MODEL/test_wavs" || true
          rm -f "$MODEL"/*.sh "$MODEL"/README.md || true
          find "$MODEL" -type f | tee model-files.txt
          sha256sum "$MODEL"/encoder-epoch-99-avg-1.int8.onnx \
            "$MODEL"/decoder-epoch-99-avg-1.onnx \
            "$MODEL"/joiner-epoch-99-avg-1.int8.onnx \
            "$MODEL"/tokens.txt | tee model-required.sha256

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee ../gradle-assemble.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee ../apk.sha256
          ls -lh app/build/outputs/apk/debug/app-debug.apk | tee ../apk-ls.txt

      - name: Upload APK and logs
        uses: actions/upload-artifact@v4
        with:
          name: interview-client-d-artifacts
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
            apk-ls.txt
            core-check.log
            protocol-check.log
            gradle-assemble.log
            jni-libs-list.txt
            model-required.sha256
            downloads/android-libs.sha256
            downloads/model-14m.sha256
            SHERPA_ONNX_COMMIT.txt
            docs/sherpa-onnx-upstream.txt
          if-no-files-found: error
